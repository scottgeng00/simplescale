[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simplescale"
version = "0.1.0"
description = "A small Slurm-native lease queue for elastic SGLang generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.10,<4",
]

[project.optional-dependencies]
sglang = ["sglang==0.5.21"]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
simplescale = "simplescale.cli:main"
simplescale-manager = "simplescale.manager:main"
simplescale-worker = "simplescale.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simplescale"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
